<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/wiki/assets/wiki.css" | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-brand" href="{{ "/" | relative_url }}">Quest of D 4.0 <span class="brand-sub">Wiki</span></a>
        <nav class="site-nav" aria-label="Navegação principal">
          <a href="{{ "/" | relative_url }}" class="nav-link{% if page.url == '/' or page.url == '/index.html' %} active{% endif %}">Início</a>
          <a href="{{ "/wiki/pt-br/items.html" | relative_url }}" class="nav-link{% if page.url contains '/items' %} active{% endif %}">Itens</a>
          <a href="{{ "/wiki/pt-br/cards.html" | relative_url }}" class="nav-link{% if page.url contains '/cards' %} active{% endif %}">Cartas D-Force</a>
          <a href="{{ "/wiki/pt-br/skills.html" | relative_url }}" class="nav-link{% if page.url contains '/skills' %} active{% endif %}">Habilidades</a>
        </nav>
      </div>
    </header>
    <main class="site-main">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="site-footer-inner">
        <span>Quest of D 4.0 (2007) — Banco de dados em PT-BR com IDs originais preservados.</span>
      </div>
    </footer>
    <script defer src="{{ "/wiki/assets/wiki.js" | relative_url }}"></script>
  </body>
</html>
